fullnameOverride: central-monitoring

defaultRules:
  create: true

kubeControllerManager:
  enabled: false

kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

coreDns:
  enabled: false

grafana:
  enabled: true

  admin:
    existingSecret: central-monitoring-grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  defaultDashboardsTimezone: browser

  persistence:
    enabled: true
    storageClassName: standard
    accessModes:
      - ReadWriteOnce
    size: 2Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheus:
  enabled: true

  service:
    type: NodePort
    nodePort: 30909

  prometheusSpec:
    enableRemoteWriteReceiver: true
    retention: 7d
    retentionSize: 3GB
    scrapeInterval: 30s
    evaluationInterval: 30s

    externalLabels:
      cloud: local
      environment: management
      cluster: platform-mgmt

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1536Mi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 4Gi

alertmanager:
  enabled: true

  alertmanagerSpec:
    alertmanagerConfigSelector:
      matchLabels:
        platform.local/alertmanager: central-monitoring

    alertmanagerConfigNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring

    # Central rules describe remote EKS, AKS and GKE clusters and do not
    # always carry the local monitoring namespace label.
    alertmanagerConfigMatcherStrategy:
      type: None

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
