apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-rca
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ai-rca
    app.kubernetes.io/component: incident-analysis
    app.kubernetes.io/part-of: multicloud-monitoring
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-rca
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ai-rca
    app.kubernetes.io/component: incident-analysis
    app.kubernetes.io/part-of: multicloud-monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-rca
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-rca
        app.kubernetes.io/component: incident-analysis
        app.kubernetes.io/part-of: multicloud-monitoring
    spec:
      serviceAccountName: ai-rca
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: gitlab-platform-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-rca
          image: registry.gitlab.com/skcloud2007/multicloud-platform-bootstrap/ai-rca:0145a425
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LISTEN_ADDRESS
              value: ":8080"
            - name: OLLAMA_URL
              value: "http://host.docker.internal:11434"
            - name: OLLAMA_MODEL
              value: "llama3.2:3b"
            - name: OLLAMA_TIMEOUT
              value: "120s"
            - name: PROMETHEUS_URL
              value: "http://central-monitoring-prometheus.monitoring.svc.cluster.local:9090"
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: central-monitoring-slack-webhook
                  key: api-url
            - name: WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-rca-webhook-auth
                  key: token
            - name: GRAFANA_URL
              value: "http://localhost:3000/d/multicloud-central-overview/multi-cloud-central-overview"
            - name: PROMETHEUS_UI_URL
              value: "http://localhost:9090/alerts"
            - name: ALERTMANAGER_URL
              value: "http://localhost:9093/#/alerts"
            - name: ARGOCD_URL
              value: "https://localhost:8080/applications"
            - name: DEDUPE_TTL
              value: "4h"
            - name: QUEUE_SIZE
              value: "20"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ai-rca
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ai-rca
    app.kubernetes.io/component: incident-analysis
    app.kubernetes.io/part-of: multicloud-monitoring
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai-rca
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
